<h2 class="mb-6 text-2xl font-semibold text-gray-800">
  {{ isEditMode ? 'Edit Course' : 'Insert New Course' }}
</h2>

<form
  #courseForm="ngForm"
  (ngSubmit)="onSubmit()"
  class="max-w-lg bg-white p-8 rounded-lg shadow-md space-y-4"
>
  <div class="mb-4">
    <label for="title" class="block text-gray-700 font-medium mb-1">Title</label>
    <input
      id="title"
      name="title"
      type="text"
      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 transition-colors"
      required
      [(ngModel)]="course.title"
    />
  </div>

  <div class="mb-4">
    <label for="instructor" class="block text-gray-700 font-medium mb-1">Instructor</label>
    <input
      id="instructor"
      name="instructor"
      type="text"
      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 transition-colors"
      required
      [(ngModel)]="course.instructor"
    />
  </div>

  <div class="mb-4">
    <label for="price" class="block text-gray-700 font-medium mb-1">Price</label>
    <input
      id="price"
      name="price"
      type="number"
      min="0"
      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 transition-colors"
      required
      [(ngModel)]="course.price"
    />
  </div>

  <div class="mb-4">
    <label for="seats" class="block text-gray-700 font-medium mb-1">Seats</label>
    <input
      id="seats"
      name="seats"
      type="number"
      min="0"
      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 transition-colors"
      required
      [(ngModel)]="course.seats"
    />
  </div>

  <div class="mb-4">
    <label for="image" class="block text-gray-700 font-medium mb-1">Image URL</label>
    <input
      id="image"
      name="image"
      type="text"
      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 transition-colors"
      [(ngModel)]="course.image"
    />
  </div>

  <div class="mb-6">
    <label for="categoryId" class="block text-gray-700 font-medium mb-1">Category</label>
    <select
      id="categoryId"
      name="categoryId"
      class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:border-blue-500 transition-colors"
      required
      [(ngModel)]="course.categoryId"
    >
      <option [ngValue]="0" disabled>Select category</option>
      <option *ngFor="let cat of categories" [ngValue]="cat.id">
        {{ cat.name }}
      </option>
    </select>
  </div>

  <button
    type="submit"
    class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md transition-colors disabled:opacity-50"
    [disabled]="courseForm.invalid"
  >
    {{ isEditMode ? 'Update' : 'Insert' }}
  </button>
</form>
